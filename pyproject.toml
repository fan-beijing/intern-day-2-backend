[project]
name = "intern-day-2-backend"
version = "1.0.0"
description = "登录鉴权 + 个人记账接口（FastAPI + SQLite）"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.163.1",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy==2.1.8",
    "bcrypt==5.0.0",
    "python-dotenv==1.2.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "httpx2>=2.16,<3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# 让 pytest 把仓库根目录加入 sys.path，容器内 `uv run pytest` 也能导入 app 包
pythonpath = ["."]
addopts = "-q"
