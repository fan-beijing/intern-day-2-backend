<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0; width: 1280px;
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    background: #fdfaf3; color: #17140f;
  }
  svg { display: block; }
  .box { fill: #fff; stroke: #b9ae9b; stroke-width: 1.4; }
  .box-agent { fill: #fbf4ec; stroke: #b03a2e; }
  .box-model { fill: #f2f6f3; stroke: #4a6b5a; }
  .t-b { font-size: 16px; font-weight: 700; fill: #17140f; }
  .t-s { font-size: 12.5px; fill: #554d41; }
  .t-xs { font-size: 11.5px; fill: #6f6656; }
  .mono { font-family: Consolas, "Courier New", monospace; font-size: 12px; fill: #8c2c22; }
  .flow { stroke: #554d41; stroke-width: 1.6; fill: none; }
  .flow-dash { stroke: #8f8574; stroke-width: 1.3; fill: none; stroke-dasharray: 6 4; }
  .flow-green { stroke: #4a6b5a; stroke-width: 1.5; fill: none; }
  .chip { fill: #b03a2e; }
  .chip-t { fill: #fff; font-size: 11px; font-weight: 700; text-anchor: middle; }
</style>
</head>
<body>
<svg width="1280" height="1010" viewBox="0 0 1280 1010" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#554d41" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a6b5a" />
    </marker>
    <marker id="arrow-dash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8f8574" />
    </marker>
  </defs>

  <text x="40" y="40" class="t-b" style="font-size:21px">第三天交互图：浏览器 → CopilotKit Runtime → FastAPI AG-UI → Agent → 模型/工具</text>
  <text x="40" y="64" class="t-s">实际实现：CopilotKit 1.90.2 · agent-framework-ag-ui 1.8.1 · FastAPI 0.162.2 · 两个独立 Compose 项目</text>
  <line x1="40" y1="84" x2="1240" y2="84" stroke="#dfd3bd" stroke-width="1" />

  <!-- 浏览器 -->
  <rect x="34" y="104" width="300" height="256" rx="10" fill="none" stroke="#dfd3bd" stroke-dasharray="5 4" />
  <text x="48" y="126" class="t-s">浏览器 · http://localhost:5173</text>
  <rect x="50" y="138" width="268" height="206" class="box" />
  <text x="64" y="162" class="t-b">React 页面（第二天项目）</text>
  <text x="64" y="184" class="t-s">LedgerPage + AgentPanel</text>
  <text x="64" y="204" class="t-s">登录后才有入口</text>
  <rect x="64" y="218" width="240" height="110" rx="6" fill="#fbf4ec" stroke="#c9a99a" />
  <text x="76" y="238" class="t-s">CopilotKitProvider + CopilotChat</text>
  <text x="76" y="258" class="t-xs">useSingleEndpoint：所有动作</text>
  <text x="76" y="274" class="t-xs">走一个 POST /api/copilotkit</text>
  <text x="76" y="294" class="t-xs">headers 每次请求现取</text>
  <text x="76" y="310" class="t-xs">Authorization: Bearer &lt;登录令牌&gt;</text>

  <!-- Runtime -->
  <rect x="392" y="104" width="308" height="256" rx="10" fill="none" stroke="#dfd3bd" stroke-dasharray="5 4" />
  <text x="406" y="126" class="t-s">前端 Compose 项目 · runtime 服务</text>
  <rect x="408" y="138" width="276" height="206" class="box" />
  <text x="422" y="162" class="t-b">CopilotKit Runtime</text>
  <text x="422" y="182" class="t-s">Express · 容器内 :4000</text>
  <text x="422" y="204" class="mono">POST /api/copilotkit</text>
  <text x="422" y="224" class="t-s">single-route 信封模式</text>
  <text x="422" y="246" class="t-s">每个请求单独构造 HttpAgent：</text>
  <text x="422" y="266" class="t-xs">headers 直接取该请求的 Authorization，</text>
  <text x="422" y="282" class="t-xs">Runtime 不持有任何用户凭证</text>
  <text x="422" y="304" class="t-xs">无令牌 → 建立连接前直接 401</text>
  <text x="422" y="324" class="t-xs">threads: owner（会话 id 即凭证）</text>

  <!-- FastAPI -->
  <rect x="758" y="104" width="488" height="256" rx="10" fill="none" stroke="#dfd3bd" stroke-dasharray="5 4" />
  <text x="772" y="126" class="t-s">后端 Compose 项目 · api 服务（容器内 :8000，宿主机 8000）</text>
  <rect x="774" y="138" width="456" height="206" class="box" />
  <text x="788" y="162" class="t-b">FastAPI（Python 3.13）</text>
  <text x="788" y="184" class="mono">POST /agent　AG-UI 端点（text/event-stream）</text>
  <text x="788" y="206" class="t-s">dependencies 先校验 Bearer：失败 401，模型不会被调用</text>
  <rect x="788" y="220" width="428" height="110" rx="6" class="box-agent" />
  <text x="802" y="242" class="t-s">Agent Framework Agent「雪庐小账房」</text>
  <text x="802" y="264" class="t-xs">OpenAIChatCompletionClient → DeepSeek（/chat/completions）</text>
  <text x="802" y="284" class="t-xs">工具 month_summary：只读查「当前登录用户」月度汇总</text>
  <text x="802" y="304" class="t-xs">身份取自已验证会话的 ContextVar，模型无法指定 user_id</text>
  <text x="802" y="322" class="t-xs">authorization_scope_resolver 按用户隔离运行作用域</text>

  <!-- 模型 -->
  <rect x="774" y="410" width="216" height="86" class="box box-model" />
  <text x="788" y="432" class="t-b" style="font-size:14px">DeepSeek（OpenAI 兼容）</text>
  <text x="788" y="452" class="t-xs">https://api.deepseek.com/v1</text>
  <text x="788" y="470" class="t-xs">POST /chat/completions</text>
  <text x="788" y="486" class="t-xs">密钥只在后端 .env</text>

  <!-- SQLite -->
  <rect x="1018" y="410" width="212" height="86" class="box" />
  <text x="1032" y="432" class="t-b" style="font-size:14px">SQLite（命名卷）</text>
  <text x="1032" y="452" class="t-xs">ledger-data:/app/data</text>
  <text x="1032" y="470" class="t-xs">WHERE user_id = 登录用户</text>
  <text x="1032" y="486" class="t-xs">只读查询，无写入</text>

  <!-- 箭头：浏览器 → Runtime -->
  <path d="M 320 200 L 404 200" class="flow" marker-end="url(#arrow)" />
  <circle cx="362" cy="200" r="11" class="chip" /><text x="362" y="204" class="chip-t">①</text>

  <!-- Runtime → FastAPI -->
  <path d="M 686 200 L 770 200" class="flow" marker-end="url(#arrow)" />
  <circle cx="728" cy="200" r="11" class="chip" /><text x="728" y="204" class="chip-t">②</text>

  <!-- 事件流回传（下方两条） -->
  <path d="M 770 244 L 686 244" class="flow" marker-end="url(#arrow)" />
  <circle cx="728" cy="244" r="11" class="chip" /><text x="728" y="248" class="chip-t">⑥</text>
  <path d="M 404 244 L 320 244" class="flow" marker-end="url(#arrow)" />
  <circle cx="362" cy="244" r="11" class="chip" /><text x="362" y="248" class="chip-t">⑦</text>

  <!-- Agent → 模型 -->
  <path d="M 880 332 L 880 406" class="flow" marker-end="url(#arrow)" />
  <circle cx="880" cy="368" r="11" class="chip" /><text x="880" y="372" class="chip-t">③</text>

  <!-- 模型 → Agent（tool_calls） -->
  <path d="M 996 430 L 996 348 L 1220 348 L 1220 334" class="flow-green" marker-end="url(#arrow-green)" />
  <circle cx="1100" cy="348" r="11" fill="#4a6b5a" /><text x="1100" y="352" class="chip-t">④</text>

  <!-- 工具 → SQLite -->
  <path d="M 1150 334 L 1150 406" class="flow-dash" marker-end="url(#arrow-dash)" />
  <circle cx="1150" cy="370" r="11" fill="#8f8574" /><text x="1150" y="374" class="chip-t">⑤</text>

  <!-- 图例 -->
  <rect x="34" y="522" width="592" height="212" rx="10" fill="#fff" stroke="#dfd3bd" />
  <text x="52" y="548" class="t-b">编号对应（与代码一致）</text>
  <text x="52" y="576" class="t-s">①　浏览器把用户消息 + Bearer 令牌 POST 到同源 /api/copilotkit</text>
  <text x="52" y="600" class="t-s">②　Vite 代理转发到 runtime 服务；Runtime 按该请求的令牌建 HttpAgent</text>
  <text x="52" y="624" class="t-s">③　Agent 调模型（OpenAI 兼容 /chat/completions，stream=true）</text>
  <text x="52" y="648" class="t-s">④　模型返回 tool_calls(month_summary)，Agent 执行工具</text>
  <text x="52" y="672" class="t-s">⑤　工具按已验证身份查 SQLite，返回汇总文本（不写入）</text>
  <text x="52" y="696" class="t-s">⑥　工具结果回填上下文，模型生成最终回答，AG-UI 事件流回到 Runtime</text>
  <text x="52" y="720" class="t-s">⑦　Runtime → 浏览器；前端按 TEXT_MESSAGE_CONTENT 逐段追加显示</text>

  <rect x="650" y="522" width="596" height="212" rx="10" fill="#fff" stroke="#dfd3bd" />
  <text x="668" y="548" class="t-b">一次运行的 AG-UI 事件序列</text>
  <text x="668" y="576" class="mono">RUN_STARTED</text>
  <text x="668" y="598" class="t-s">TEXT_MESSAGE_START → TOOL_CALL_START(month_summary)</text>
  <text x="668" y="620" class="t-s">TOOL_CALL_ARGS → TOOL_CALL_END → TOOL_CALL_RESULT</text>
  <text x="668" y="642" class="t-s">TEXT_MESSAGE_CONTENT（多次增量）→ TEXT_MESSAGE_END</text>
  <text x="668" y="664" class="t-s">MESSAGES_SNAPSHOT → RUN_FINISHED</text>
  <text x="668" y="686" class="t-s" style="fill:#8c2c22">RUN_ERROR：模型报错或运行中断时的失败路径</text>
  <text x="668" y="714" class="t-xs" style="fill:#8c2c22">事件格式是 AG-UI 协议；传输是 HTTP + SSE，不是 WebSocket</text>

  <!-- 地址与认证 -->
  <rect x="34" y="756" width="1212" height="222" rx="10" fill="#fff" stroke="#dfd3bd" />
  <text x="52" y="782" class="t-b">地址与认证（评审最容易被追问的三处）</text>

  <text x="52" y="812" class="t-s">1. 三个地址不是一回事</text>
  <text x="68" y="834" class="t-xs">浏览器访问：http://localhost:5173（web）· http://localhost:4000（runtime，代理直连）· http://localhost:8000（api）</text>
  <text x="68" y="854" class="t-xs">容器内：web:5173 · runtime:4000 · api:8000；服务名只在同一 Compose 项目内可解析</text>
  <text x="68" y="874" class="t-xs">跨项目：runtime 通过 host.docker.internal:8000 访问后端，不假定对方服务名可解析</text>

  <text x="52" y="904" class="t-s">2. 两个凭证各归各的</text>
  <text x="68" y="926" class="t-xs">登录令牌：浏览器 localStorage → 每个请求的 Authorization → Runtime 原样转给 FastAPI；模型密钥：只在后端 .env，浏览器与 Runtime 都拿不到</text>

  <text x="52" y="956" class="t-s">3. 鉴权发生在模型之前</text>
  <text x="68" y="976" class="t-xs">未登录 → 401（Runtime 先挡一次，FastAPI 再判一次）→ 不产生模型调用；threadId / runId 只是标识，不是凭证</text>
</svg>
</body>
</html>
