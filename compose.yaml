name: intern-day-2-backend

services:
  api:
    build: .
    image: intern-day-2-backend:local
    container_name: intern-day-2-backend
    env_file:
      # 缺少 .env 时不在这里报错，交给应用启动时给出「缺 SEED_PASSWORD」的可操作提示
      - path: .env
        required: false
    environment:
      # 覆盖 .env 里的本机路径，固定指向命名卷挂载点
      DATABASE_URL: sqlite:////app/data/app.db
      # 第三天：模型服务配置只在后端容器内可见。
      # 值来自 .env（env_file 已加载）；这里显式声明，空值也不会被打进镜像。
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-https://api.deepseek.com/v1}
      MODEL_ID: ${MODEL_ID:-deepseek-chat}
    ports:
      - "8000:8000"
    volumes:
      - ledger-data:/app/data
    networks:
      # 加入与前端共享的网络，并给这个容器起别名 api，
      # 让前端 Runtime 能用 http://api:8000/agent 访问它（不依赖宿主机端口）。
      # 该网络由 README 里的 `docker network create intern-day-shared` 预先创建。
      default:
      shared:
        aliases:
          - api
    restart: unless-stopped

networks:
  shared:
    name: intern-day-shared
    external: true

volumes:
  ledger-data:
    name: intern-day-2-backend-data
